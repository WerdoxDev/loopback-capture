[package]
name = "loopback-capture"
version = "4.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "System and process-tree audio capture for Node.js on Windows and Linux"
repository = "https://github.com/WerdoxDev/loopback-capture"

[lib]
name = "loopback_capture_addon"
crate-type = ["cdylib", "rlib"]

[features]
default = ["node-addon"]
node-addon = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "2.16.17", optional = true, default-features = false, features = ["napi9", "dyn-symbols", "compat-mode"] }
napi-derive = { version = "2.16.13", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.9.2", features = ["v0_3_65"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Security",
] }

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
